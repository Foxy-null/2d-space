/* DQ風上書き */
body{background:#000 !important;color:#fff;font-family:monospace;}
.window{background:#000 !important;border:2px solid #fff !important;border-radius:0 !important;box-shadow:none !important}
button{background:#000;border:2px solid #fff;color:#fff}
.commands{display:block}
.commands button{display:block;width:100%;margin-bottom:4px;text-align:left}
.log{background:#000;border:2px solid #fff}
.card{background:#000;border:1px solid #fff}
.selected{background:#222}



/* === 完全版：コマンド2列 + ポップアップ2列 + MP制限修正 === */
.commands{
  display:grid !important;
  grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  gap:6px !important;
  align-items:stretch !important;
}
.commands > button{
  width:100% !important;
  margin:0 !important;
  display:block !important;
  text-align:left !important;
}
#nextBtn{ grid-column:1 / -1 !important; }
.commands > .popup{ grid-column:1 / -1 !important; }
#skillMenu.popup,
#magicMenu.popup,
#itemMenu.popup,
#craftMenu.popup,
#equipMenu.popup,
#questMenu.popup,
#bookMenu.popup,
#menuGroup.popup{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#000;
  border:2px solid #fff;
  padding:12px;
  z-index:1000;
  width:min(520px, 94vw);
  max-height:80vh;
  overflow-y:auto;
  gap:6px;
}
#bookMenu.popup{ z-index:1100 !important; }
#skillMenu.popup.show,
#magicMenu.popup.show,
#itemMenu.popup.show,
#craftMenu.popup.show,
#equipMenu.popup.show,
#questMenu.popup.show,
#bookMenu.popup.show,
#menuGroup.popup.show{
  display:grid !important;
  grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  align-items:stretch !important;
}
#skillMenu.popup button,
#magicMenu.popup button,
#itemMenu.popup button,
#craftMenu.popup button,
#equipMenu.popup button,
#questMenu.popup button,
#bookMenu.popup button,
#menuGroup.popup button{
  display:block;
  width:100%;
  margin:0 !important;
  text-align:left;
}
.popupCloseBtn,
#closeMenuBtn{
  grid-column:1 / -1 !important;
  background:#300 !important;
  border:2px solid #f88 !important;
  margin-bottom:4px !important;
}
.popup .sectionTitle{
  grid-column:1 / -1 !important;
}
.popup > .small,
.popup > .card{
  grid-column:1 / -1 !important;
}
#closeBookBtn{
  position:relative;
  z-index:1101 !important;
  pointer-events:auto !important;
}
@media(max-width:760px){
  .commands{
    display:grid !important;
    grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
    gap:6px !important;
  }
  #skillMenu.popup.show,
  #magicMenu.popup.show,
  #itemMenu.popup.show,
  #craftMenu.popup.show,
  #equipMenu.popup.show,
  #questMenu.popup.show,
  #bookMenu.popup.show,
  #menuGroup.popup.show{
    grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  }
}

ansparent}}@keyframes victoryBurst{0%{box-shadow:inset 0 0 0 #facc1500;background:transparent}25%{box-shadow:inset 0 0 150px #facc15aa;background:#facc1526}100%{box-shadow:inset 0 0 0 #facc1500;background:transparent}}

function talentList(m){return talentDefs[m.role]||[]}
function hasTalent(m,id){return !!(m.talents&&m.talents[id])}
function talentEff(m,key){let v=0;talentList(m||{}).forEach(t=>{if(hasTalent(m,t.id)&&t.effect&&t.effect[key])v+=t.effect[key]});return v}
function partyTalentEff(role,key){return party.filter(m=>m.hp>0&&(!role||m.role===role)).reduce((s,m)=>s+talentEff(m,key),0)}
function canLearnTalent(m,t){if(!m.talents)m.talents={};if(hasTalent(m,t.id))return false;if((m.sp||0)<t.cost)return false;if(t.require&&!hasTalent(m,t.require))return false;return true}

function renderEquip(){let menu=$('equipMenu');menu.innerHTML='<button id="closeEquipBtn" class="popupCloseBtn">× 閉じる</button><div class=sectionTitle>装備</div>';$('closeEquipBtn').onclick=()=>closePopup('equipMenu');let m=tgtA();let target=document.createElement('div');target.className='small';target.innerHTML=`現在の対象：<b>${m.emoji} ${m.name}</b><br>味方カードをクリックすると装備対象を変更できます。<br>各装備に「装備可能」を表示します。`;menu.appendChild(target);['weapon','armor','accessory'].forEach(slot=>{let b=document.createElement('button');b.textContent=`${slotLabel(slot)}を外す`;b.disabled=!m.equip[slot];b.onclick=()=>unequip(selA,slot);menu.appendChild(b)});let hInv=document.createElement('div');hInv.className='sectionTitle';hInv.textContent='所持装備';menu.appendChild(hInv);let owned=equipDefs.filter(e=>(equips[e.id]||0)>0);if(!owned.length){let empty=document.createElement('div');empty.className='small';empty.textContent='所持装備がありません';menu.appendChild(empty)}owned.forEach(e=>{let can=e.jobs.includes(m.role),b=document.createElement('button');b.innerHTML=`${can?'':'🚫 '}[${e.rarity}] ${e.name} x${equips[e.id]}<br><span class=small>種類:${slotLabel(e.slot)} / 装備可能:${jobsText(e.jobs)}${can?'':'<br><span class=red>現在選択中の仲間は装備できません</span>'}<br>${e.desc}</span>`;b.disabled=!can;b.onclick=()=>equip(selA,e.id);menu.appendChild(b)});let h=document.createElement('div');h.className='sectionTitle';h.textContent='装備クラフト';menu.appendChild(h);equipRecipes.forEach(r=>{let e=eDef(r.id),b=document.createElement('button');b.innerHTML=`${e.name}<br><span class=small>種類:${slotLabel(e.slot)} / 装備可能:${jobsText(e.jobs)}<br>${costText(r.cost)}<br>完成品にランダム追加効果</span>`;b.disabled=!canCraftEq(r);b.onclick=()=>craftEq(r.id);menu.appendChild(b)})}function renderQuest(){let menu=$('questMenu');menu.innerHTML='<button id="closeQuestBtn" class="popupCloseBtn">× 閉じる</button><div class=sectionTitle>クエスト</div>';$('closeQuestBtn').onclick=()=>closePopup('questMenu');let qs=unlockedQuests();let cats=[...new Set(qs.map(q=>q.cat||'その他'))];cats.forEach(cat=>{let h=document.createElement('div');h.className='sectionTitle';h.textContent='◆ '+cat;menu.appendChild(h);qs.filter(q=>(q.cat||'その他')===cat).forEach(q=>{let done=quest[q.id],ok=q.now>=q.goal,b=document.createElement('button');b.innerHTML=`${done?'✅ ':ok?'⭐ ':'□ '}${q.name}<br><span class=small>${Math.min(q.now,q.goal)}/${q.goal} 報酬:${rewardLabel(q)}</span>`;b.disabled=done||!ok;b.onclick=()=>claimQuest(q.id);menu.appendChild(b)})})}function renderBook(){let menu=$('bookMenu');menu.innerHTML='<button id="closeBookBtn" class="popupCloseBtn">× 閉じる</button><div class=sectionTitle>敵図鑑</div>';let close=$('closeBookBtn');if(close)close.onclick=()=>closePopup('bookMenu');let rows=Object.values(bestiary);if(!rows.length){let empty=document.createElement('div');empty.className='small';empty.textContent='まだ記録なし';menu.appendChild(empty);return}rows.forEach(r=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${r.name}</b> 討伐:${r.kills}<br><span class=small>弱点:${ename[r.weak]||'-'} / 耐性:${ename[r.resist]||'-'} / 種別:${r.drops}</span>`;menu.appendChild(d)})}
function renderTalent(){let menu=$('talentMenu');if(!menu)return;let m=tgtA();if(!m.talents)m.talents={};menu.innerHTML='<button id="closeTalentBtn" class="popupCloseBtn">× 閉じる</button>'+`<div class=sectionTitle>スキルツリー：${m.emoji} ${m.name}</div><div class=small>所持SP：${m.sp||0} / 味方カードをクリックして対象変更</div>`;$('closeTalentBtn').onclick=()=>closePopup('talentMenu');let list=talentList(m),branches=[...new Set(list.map(t=>t.branch||'その他'))];branches.forEach(branch=>{let h=document.createElement('div');h.className='sectionTitle';h.textContent='◆ '+branch;menu.appendChild(h);list.filter(t=>(t.branch||'その他')===branch).forEach(t=>{let learned=hasTalent(m,t.id),reqOk=!t.require||hasTalent(m,t.require),spOk=(m.sp||0)>=t.cost,b=document.createElement('button');b.className=learned?'talentLearned':(!reqOk?'talentLocked':'');b.innerHTML=`${learned?'✅ ':reqOk?'□ ':'🔒 '}${t.name} SP${t.cost}<br><span class=small>${t.desc}${t.require&&!reqOk?'<br>前提スキルが必要':''}${!spOk&&!learned&&reqOk?'<br>SPが足りません':''}</span>`;b.disabled=learned||!reqOk||!spOk||busy;b.onclick=()=>learnTalent(selA,t.id);menu.appendChild(b)})})}
function materialText(){return Object.entries(mat).map(([k,n])=>`${n}:${materials[k]||0}`).join('　')}function update(){tgtE();renderEnemies();renderParty();renderSkill();renderItems();renderCraft();renderEquip();renderQuest();renderTalent();renderBook();$('materialText').textContent='素材：'+materialText();let m=cur(),dis=busy||finished;$('waveText').textContent=`洞窟 第${wave}階層 / 難易度:${D().label} / 道:${route.name}`;$('bossText').innerHTML=wave%5===0?'<div class="sectionTitle red">⚠ ボス部屋：危険行動予告に注意</div>':'';$('turnText').textContent=finished?'終了':busy?'行動中':`${m.name}のターン`;$('targetText').textContent=finished?'バトル終了':`攻撃対象:${tgtE()?.name||'なし'} / 味方対象:${tgtA()?.name||'なし'}`;setActionLocks()}
function restart(){resetEquipDefs();party=members.map(C);party.forEach(m=>{m.equip={weapon:null,armor:null,accessory:null};m.sp=0;m.talents={}});items={herb:4,hiHerb:1,manaWater:2,panacea:1,reviveStone:0,trainingBook:1,powerSeed:0,guardSeed:0,lifeFruit:0,magicFruit:0};materials={herbFlower:2,magicOre:1,slimeJelly:1,poisonSpore:0,dragonScale:0};equips={};quest={};stats={};bestiary={};route={name:'通常の道',hp:1,atk:1,reward:1,event:.35,force:null};routeChosen=false;wave=1;active=0;selA=0;selE=0;busy=false;finished=false;preparing=false;['bronzeSword','apprenticeStaff','prayerStaff','ironArmor','magicRobe','lifeRing'].forEach(id=>addEq(id));stats.eqGet=0;enemies=makeEnemies();$('log').innerHTML='';$('result').textContent='';$('nextBtn').style.display='none';$('eventArea').innerHTML='';$('routeArea').innerHTML='';log(`難易度：${D().label} / 全部入り完成版で開始！`,'yellow');update()}
document.querySelectorAll('.diff label').forEach(x=>x.onclick=()=>{curDiff=x.dataset.d;document.querySelectorAll('.diff label').forEach(l=>l.classList.toggle('sel',l.dataset.d===curDiff));document.querySelectorAll('input[name=d]').forEach(r=>r.checked=r.value===curDiff)});$('startBtn').onclick=()=>{$('start').style.display='none';restart()};$('attackBtn').onclick=()=>turn(attack);$('skillBtn').onclick=()=>togglePopup('skillMenu');$('magicBtn').onclick=()=>{hideMenus();let a=cur(),fc=mCost(a,3),sc=mCost(a,6),hc=mCost(a,4),m=$('magicMenu');m.innerHTML=`<button id="closeMagicBtn" class="popupCloseBtn">× 閉じる</button><div class=sectionTitle>魔法</div><button id="fireMenuBtn">火球 MP${fc}</button><button id="sparkMenuBtn">稲妻 MP${sc}<br><span class=small>全体</span></button><button id="healMenuBtn">癒し MP${hc}</button>`;m.classList.add('show');$('closeMagicBtn').onclick=()=>closePopup('magicMenu');$('fireMenuBtn').disabled=busy||finished||a.mp<fc;$('sparkMenuBtn').disabled=busy||finished||a.mp<sc;$('healMenuBtn').disabled=busy||finished||a.mp<hc;$('fireMenuBtn').onclick=()=>turn(fire);$('sparkMenuBtn').onclick=()=>turn(spark);$('healMenuBtn').onclick=()=>turn(heal);setActionLocks()};$('guardBtn').onclick=()=>turn(guard);$('itemBtn').onclick=()=>togglePopup('itemMenu');$('menuBtn').onclick=()=>togglePopup('menuGroup');$('closeMenuBtn').onclick=()=>closePopup('menuGroup');$('craftBtn').onclick=()=>openPopup('craftMenu');$('equipBtn').onclick=()=>openPopup('equipMenu');$('questBtn').onclick=()=>openPopup('questMenu');$('talentBtn').onclick=()=>openPopup('talentMenu');$('bookBtn').onclick=()=>openPopup('bookMenu');$('nextBtn').onclick=nextBattle;$('restartBtn').onclick=restart;resetEquipDefs();restart();
</script>
