/* DQ風上書き */
body{background:#000 !important;color:#fff;font-family:monospace;}
.window{background:#000 !important;border:2px solid #fff !important;border-radius:0 !important;box-shadow:none !important}
button{background:#000;border:2px solid #fff;color:#fff}
.commands{display:block}
.commands button{display:block;width:100%;margin-bottom:4px;text-align:left}
.log{background:#000;border:2px solid #fff}
.card{background:#000;border:1px solid #fff}
.selected{background:#222}



/* === 完全版：コマンド2列 + ポップアップ2列 + MP制限修正 === */
.commands{
  display:grid !important;
  grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  gap:6px !important;
  align-items:stretch !important;
}
.commands > button{
  width:100% !important;
  margin:0 !important;
  display:block !important;
  text-align:left !important;
}
#nextBtn{ grid-column:1 / -1 !important; }
.commands > .popup{ grid-column:1 / -1 !important; }
#skillMenu.popup,
#magicMenu.popup,
#itemMenu.popup,
#craftMenu.popup,
#equipMenu.popup,
#questMenu.popup,
#bookMenu.popup,
#menuGroup.popup{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#000;
  border:2px solid #fff;
  padding:12px;
  z-index:1000;
  width:min(520px, 94vw);
  max-height:80vh;
  overflow-y:auto;
  gap:6px;
}
#bookMenu.popup{ z-index:1100 !important; }
#skillMenu.popup.show,
#magicMenu.popup.show,
#itemMenu.popup.show,
#craftMenu.popup.show,
#equipMenu.popup.show,
#questMenu.popup.show,
#bookMenu.popup.show,
#menuGroup.popup.show{
  display:grid !important;
  grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  align-items:stretch !important;
}
#skillMenu.popup button,
#magicMenu.popup button,
#itemMenu.popup button,
#craftMenu.popup button,
#equipMenu.popup button,
#questMenu.popup button,
#bookMenu.popup button,
#menuGroup.popup button{
  display:block;
  width:100%;
  margin:0 !important;
  text-align:left;
}
.popupCloseBtn,
#closeMenuBtn{
  grid-column:1 / -1 !important;
  background:#300 !important;
  border:2px solid #f88 !important;
  margin-bottom:4px !important;
}
.popup .sectionTitle{
  grid-column:1 / -1 !important;
}
.popup > .small,
.popup > .card{
  grid-column:1 / -1 !important;
}
#closeBookBtn{
  position:relative;
  z-index:1101 !important;
  pointer-events:auto !important;
}
@media(max-width:760px){
  .commands{
    display:grid !important;
    grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
    gap:6px !important;
  }
  #skillMenu.popup.show,
  #magicMenu.popup.show,
  #itemMenu.popup.show,
  #craftMenu.popup.show,
  #equipMenu.popup.show,
  #questMenu.popup.show,
  #bookMenu.popup.show,
  #menuGroup.popup.show{
    grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
  }
}

ansparent}}@keyframes victoryBurst{0%{box-shadow:inset 0 0 0 #facc1500;background:transparent}25%{box-shadow:inset 0 0 150px #facc15aa;background:#facc1526}100%{box-shadow:inset 0 0 0 #facc1500;background:transparent}}

function talentList(m){return talentDefs[m.role]||[]}
function hasTalent(m,id){return !!(m.talents&&m.talents[id])}
function talentEff(m,key){let v=0;talentList(m||{}).forEach(t=>{if(hasTalent(m,t.id)&&t.effect&&t.effect[key])v+=t.effect[key]});return v}
function partyTalentEff(role,key){return party.filter(m=>m.hp>0&&(!role||m.role===role)).reduce((s,m)=>s+talentEff(m,key),0)}
function canLearnTalent(m,t){if(!m.talents)m.talents={};if(hasTalent(m,t.id))return false;if((m.sp||0)<t.cost)return false;if(t.require&&!hasTalent(m,t.require))return false;return true}
